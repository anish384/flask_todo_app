{% extends "base.html" %}
{% block content %}
<div class="todo-form-container">
  <h1>{{ action }} To-Do</h1>
  <form method="post">
    <div class="form-group">
      <label for="title">Title</label>
      <input class="form-control" name="title" id="title" value="{{ todo.title if todo else '' }}" required autofocus>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea class="form-control" name="description" id="description">{{ todo.description if todo else '' }}</textarea>
    </div>
    <div class="form-group">
      <label for="due_date">Due Date</label>
      <input class="form-control" type="date" name="due_date" id="due_date" value="{{ todo.due_date if todo and todo.due_date else '' }}">
    </div>
    {% if action == 'Edit' %}
    <div class="form-group">
      <label><input type="checkbox" name="completed" {% if todo and todo.completed %}checked{% endif %}> Completed</label>
    </div>
    {% endif %}
    <button type="submit" class="btn">{{ action }} To-Do</button>
    <a href="{{ url_for('todos.index') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
